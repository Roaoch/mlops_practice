[project]
name = "lab1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.6.1",
    "fastapi>=0.136.3",
    "gensim>=4.4.0",
    "gradio>=6.15.2",
    "matplotlib>=3.10.9",
    "scikit-learn>=1.8.0",
    "torch>=2.10.0",
    "uvicorn>=0.48.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
